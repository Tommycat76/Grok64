<!doctype html>
<meta charset="utf-8" />
<title>tablet bezel fixture</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0b; }
  .g64-app {
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 16px 0 0;
  }
  .g64-top { flex: 0 0 40px; margin: 0 12px 4px; background: #16161a; }
  .g64-stage {
    flex: 1 1 auto;
    min-height: 200px;
    display: flex;
    flex-direction: column;
    padding: 0 16px 8px;
    position: relative;
  }
  .g64-bezel {
    background: #3a2a6a;
    border-radius: 32px;
    padding: 14px;
    position: relative;
    box-sizing: border-box;
  }
  .g64-app[data-device="tablet"] .g64-bezel {
    display: flex;
    align-items: stretch;
    justify-content: stretch;
    position: absolute;
    inset: 0;
    flex: none;
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 100%;
    min-width: 0;
    min-height: 0;
    margin: auto;
    aspect-ratio: 4 / 3;
  }
  .g64-app[data-device="tablet"] .g64-screen {
    position: relative;
    inset: auto;
    flex: 1 1 auto;
    width: 100%;
    height: 100%;
    max-width: none;
    max-height: none;
    min-width: 0;
    min-height: 0;
    margin: 0;
    aspect-ratio: auto;
    background: #6c5a9a;
  }
</style>
<div class="g64-app" data-device="tablet" data-orient="landscape">
  <div class="g64-top"></div>
  <div class="g64-stage">
    <div class="g64-bezel"><div class="g64-screen"></div></div>
  </div>
</div>
